# ==============================================================================
# Configuration: SAM ViT-B + FedGS + Composite Loss Ablation (20 Rounds)
# Paper Table 4 Ablation: FedGS + Composite Loss (No DFT-HT)
# - FedGS enabled: Difficulty-aware gradient scaling (eta_t dynamic inverse area)
# - No DFT-HT: dftht_prob = 0.0 (No Fourier hard-thresholding frequency augmentation)
# - Composite Loss: lambda_dice = 0.7, lambda_bce = 0.2, lambda_focal = 0.1
# ==============================================================================

experiment:
  run_name: "ablation_sam_fedgs_composite_loss_r8_20rounds"
  output_root: "checkpoints/runs"
  save_checkpoints: true

federated:
  num_rounds: 20
  local_epochs: 2
  batch_size: 2
  learning_rate: 0.0002
  lr_schedule: "cosine"
  min_lr: 0.00001
  weight_decay: 0.00001
  num_clients: 5
  out_center: "5"            # Client index 5 = Center 6 (Strict Unseen Domain)
  split_type: "fold"
  fold_nr: 1

model:
  arch: "vit_b"
  sam_checkpoint: "sam_vit_b_01ec64.pth"
  num_cls: 2
  lora_rank: 8               # LoRA rank r=8
  if_encoder_lora_layer: true
  if_decoder_lora_layer: true
  if_update_encoder: true

fed_fgs:
  enable_fedgs: true         # FedGS enabled (difficulty-aware gradient scaling eta_t)
  dftht_prob: 0.0            # NO Fourier frequency augmentation
  dftht_L: 0.1
  dftht_alpha: 0.05
  amp_pool_max_samples: 0
  lambda_dice: 0.7           # Composite Loss: 0.7 Dice
  lambda_bce: 0.2            # Composite Loss: 0.2 BCE
  lambda_focal: 0.1          # Composite Loss: 0.1 Focal Loss (boundary & hard pixel mining)

dataset:
  data_root: "polyp_db_dataset/data"
  metadata_root: "polyp_db_dataset/metadata"
  splits_root: "fed-dftht-main/data_polypgen/splits/fold_splits"
  image_size: 1024
  num_workers: 4

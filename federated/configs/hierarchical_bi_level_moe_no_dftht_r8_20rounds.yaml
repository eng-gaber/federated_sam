# ==============================================================================
# Configuration: Hierarchical Bi-Level MoE (Encoder Domain MoE + Decoder Scale MoE)
# Ablation: Clean Frequency (NO DFT-HT), 20 Communication Rounds, LoRA r=8
# ==============================================================================
# Architecture:
# 1. Level 1 - Encoder Domain MoE (MoDE-4 with Center Prior):
#    - Blocks [8, 9, 10, 11], 5 Domain Experts (Centers 1-5), Top-2 Softmax Routing
#    - Routing Mode: mode_b (Center Prior lambda=0.2)
#    - Expert LoRA rank r=8, alpha=8.0
#    - Purpose: Eliminates cross-center hospital/sensor domain shift
#
# 2. Level 2 - Decoder Scale MoE (Scale-Aware Dual-Decoder):
#    - Dual MaskDecoders: D_small (Diminutive lesions) & D_large (Giant lesions)
#    - Image-Level Scale Router: GAP(F) -> LN -> MLP(256 -> 64 -> 2) -> Softmax
#    - Multi-Task Scale Specialization Loss: L_mix + beta * L_expert + lambda_gate * L_gate
#    - beta=0.5, lambda_gate=0.1
#    - Purpose: Eliminates diminutive vs. macroscopic lesion scale conflict
#
# 3. Federated Optimization:
#    - Difficulty-Aware Gradient Scaling (FedGS eta_t) enabled
#    - Clean frequency: dftht_prob=0.0
#    - Composite Loss: 0.7 Dice + 0.2 BCE + 0.1 Focal
# ==============================================================================

experiment:
  run_name: "hierarchical_bi_level_moe_no_dftht_r8_20rounds"
  output_root: "checkpoints/runs"
  save_checkpoints: true

federated:
  num_rounds: 20
  local_epochs: 2
  batch_size: 2
  learning_rate: 0.0002
  lr_schedule: "cosine"
  min_lr: 0.00001
  weight_decay: 0.00001
  num_clients: 5
  out_center: "5"            # Client index 5 = Center 6 (Strict Unseen Domain)
  split_type: "fold"
  fold_nr: 1

model:
  arch: "vit_b"
  sam_checkpoint: "sam_vit_b_01ec64.pth"
  num_cls: 2
  lora_rank: 8               # LoRA rank r=8
  if_encoder_lora_layer: true
  if_decoder_lora_layer: true
  if_update_encoder: true

  # Level 1: Encoder Domain MoE (MoDE-4 with Center Prior)
  enable_mode: true
  mode_blocks: [8, 9, 10, 11]
  mode_num_experts: 5
  mode_lora_rank: 8
  mode_lora_alpha: 8.0
  mode_lora_dropout: 0.0
  mode_top_k: 2
  mode_gate_hidden_dim: 128
  mode_routing_mode: "mode_b"
  mode_center_prior_lambda: 0.2

  # Level 2: Decoder Scale MoE (Scale-Aware Dual-Decoder)
  enable_scale_decoder_moe: true
  scale_moe_gate_hidden_dim: 64
  scale_moe_beta: 0.5
  scale_moe_lambda_gate: 0.1

fed_fgs:
  enable_fedgs: true         # FedGS dynamic gradient scaling eta_t
  dftht_prob: 0.0            # Clean evaluation without Fourier perturbation
  dftht_L: 0.1
  dftht_alpha: 0.05
  amp_pool_max_samples: 0
  lambda_dice: 0.7           # Paper Composite Dice loss
  lambda_bce: 0.2            # Paper Composite BCE loss
  lambda_focal: 0.1          # Paper Composite Focal loss

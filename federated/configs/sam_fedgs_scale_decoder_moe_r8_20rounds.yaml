# ==============================================================================
# Configuration: SAM-FedGS + Composite Loss + Scale-Aware Dual-Decoder MoE (20 Rounds)
# ==============================================================================
# Architecture & Design:
# 1. Image Encoder: SAM ViT-B with LoRA rank r=8, alpha=8.0 (Frozen base ViT)
# 2. Decoder: Scale-Aware Dual-Decoder MoE (D_small & D_large)
#    - Image-level Scale Gate: GAP(F) -> LN -> MLP(256 -> 64 -> 2) -> Softmax
#    - D_small: Specialized for diminutive & subtle polyps
#    - D_large: Specialized for large & high-contrast polyps
#    - Gating Weights: [w_small, w_large] blending predictions: Z_mix = w_small * Z_small + w_large * Z_large
# 3. Multi-Task Scale Specialization Loss:
#    - L_total = L_mix + beta * L_expert + lambda_gate * L_gate
#    - beta = 0.5 (Scale specialization weight)
#    - lambda_gate = 0.1 (Gating supervision cross-entropy weight)
# 4. Clean Frequency Evaluation:
#    - dftht_prob = 0.0 (No synthetic Fourier noise, preserving delicate mucosal textures)
# 5. Difficulty-Aware Scaling:
#    - enable_fedgs = true (Dynamic inverse-area scaling eta_t)
# ==============================================================================

experiment:
  run_name: "sam_fedgs_scale_decoder_moe_r8_20rounds"
  output_root: "checkpoints/runs"
  save_checkpoints: true

federated:
  num_rounds: 20
  local_epochs: 2
  batch_size: 2
  learning_rate: 0.0002
  lr_schedule: "cosine"
  min_lr: 0.00001
  weight_decay: 0.00001
  num_clients: 5
  out_center: "5"            # Client index 5 = Center 6 (Strict Unseen Domain)
  split_type: "fold"
  fold_nr: 1

model:
  arch: "vit_b"
  sam_checkpoint: "sam_vit_b_01ec64.pth"
  num_cls: 2
  lora_rank: 8               # LoRA rank r=8
  if_encoder_lora_layer: true
  if_decoder_lora_layer: true
  if_update_encoder: true

  # Scale-Aware Dual-Decoder MoE Settings
  enable_scale_decoder_moe: true
  scale_moe_gate_hidden_dim: 64
  scale_moe_beta: 0.5        # Conservative scale-specialization weight
  scale_moe_lambda_gate: 0.1 # Conservative gating supervision weight

fed_fgs:
  enable_fedgs: true         # FedGS dynamic gradient scaling eta_t
  dftht_prob: 0.0            # Clean evaluation without Fourier perturbation
  dftht_L: 0.1
  dftht_alpha: 0.05
  amp_pool_max_samples: 0
  lambda_dice: 0.7           # Paper Composite Dice loss
  lambda_bce: 0.2            # Paper Composite BCE loss
  lambda_focal: 0.1          # Paper Composite Focal loss

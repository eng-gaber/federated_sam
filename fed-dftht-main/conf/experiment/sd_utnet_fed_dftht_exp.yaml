# @package _global_

name: sd_utnet_fed_dftht_exp
desc: SD-UTNet federated learning with FedDG-DFTHT data augmentation

client:
  lr: 0.0001
  p_factor_enabled: True
  model: sd_utnet_fed
  epochs: 5

server:
  num_rounds: 100
  gradient_mode: False
  resume_from_round: null
  resume_cfg_name: null
  save_resume_enabled: True

two_stage:
  enabled: True
  aug_epochs: 5
  train_rounds: 80

data:
  load_names: False
  my_details: False

# ── FedDG-DFTHT augmentation hyperparameters ──
dftht:
  enabled: True
  L: 0.1                  # low-frequency window ratio
  ratio: [0.0, 1.0]       # interpolation ratio (sampled uniformly)
  alpha: 0.05             # hard-threshold ratio (5%)
  prob: 0.5               # probability of applying augmentation per sample
  amp_pool_max_samples: 50 # max spectra sampled per foreign center
